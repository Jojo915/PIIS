<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notebook Canvas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Pinned header: search bar, view-mode toggle, and AI Settings never
         scroll away -- only #canvasScrollArea below them does. -->
    <div class="fixed-top" id="fixedTop">
    <div class="search-container">
      <div class="search-wrapper input-wrapper">
        <button class="search-icon-btn" id="searchButton">
          <img
            src="icons/search_icon.svg"
            alt="Search"
            class="search-icon-btn-icon icon-16"
          />
        </button>
        <textarea
          class="search-bar auto-grow-input"
          id="searchInput"
          rows="1"
          placeholder="Search..."
          autofocus
        ></textarea>
        <div class="search-trailing">
          <div class="search-opts">
            <button
              class="search-opt-btn"
              id="caseSensitiveBtn"
              title="Match Case"
              aria-pressed="false"
            >
              <span class="search-opt-icon match-case-icon"></span>
            </button>
            <button
              class="search-opt-btn"
              id="wholeWordBtn"
              title="Match Whole Word"
              aria-pressed="false"
            >
              <span class="search-opt-icon match-whole-word-icon"></span>
            </button>
            <button
              class="search-opt-btn"
              id="regexBtn"
              title="Use Regular Expression"
              aria-pressed="false"
            >
              <span class="search-opt-icon regex-icon"></span>
            </button>
          </div>
          <span id="modeChip" class="mode-chip" style="display: none"></span>
          <button
            class="clear-btn"
            id="clearButton"
            style="display: none"
            title="Close Search"
          >
            <img
              src="icons/close_icon.svg"
              alt="Clear"
              class="close-icon icon-16"
            />
          </button>
        </div>
      </div>
    </div>

    <div class="summary-view-toggle" role="group" aria-label="Summary view">
      <button
        class="summary-view-btn active"
        id="sidebarSummaryViewButton"
        type="button"
        aria-pressed="true"
      >
        Sidebar
      </button>
      <button
        class="summary-view-btn"
        id="inlineSummaryViewButton"
        type="button"
        aria-pressed="false"
      >
        Inline
      </button>
    </div>

    <details class="ai-settings-card" id="aiSettingsCard">
      <summary class="ai-settings-summary">
        <img
          src="icons/dropdown_icon.svg"
          alt="Expand"
          class="chevron-icon icon-16"
        />
        <span>AI Settings</span>
      </summary>
      <div class="ai-settings-body">
        <div class="ai-settings-field">
          <label class="ai-settings-label" for="aiSettingsApiKeyInput"
            >API Key</label
          >
          <div class="ai-settings-input-row input-wrapper">
            <input
              type="password"
              class="ai-settings-text-input"
              id="aiSettingsApiKeyInput"
              placeholder="Enter API key"
              autocomplete="off"
            />
            <button
              class="ai-settings-visibility-btn"
              id="aiSettingsApiKeyToggle"
              type="button"
              title="Show API key"
              aria-pressed="false"
            >
              Show
            </button>
          </div>
        </div>

        <div class="ai-settings-field">
          <label class="ai-settings-label" for="aiSettingsModelSelect"
            >Model</label
          >
          <select class="ai-settings-select" id="aiSettingsModelSelect">
            <option value="gemini-2.5-flash-lite">
              gemini-2.5-flash-lite
            </option>
            <option value="gemini-1.5-flash">gemini-1.5-flash</option>
            <option value="other">Other model</option>
          </select>
        </div>

        <div
          class="ai-settings-field"
          id="aiSettingsCustomModelField"
          style="display: none"
        >
          <label class="ai-settings-label" for="aiSettingsCustomModelInput"
            >Custom Model Name</label
          >
          <div class="ai-settings-input-row input-wrapper">
            <input
              type="text"
              class="ai-settings-text-input"
              id="aiSettingsCustomModelInput"
              placeholder="my-custom-model"
              autocomplete="off"
            />
          </div>
        </div>

        <div class="ai-settings-field">
          <span class="ai-settings-group-label">Analysis Options</span>
          <label class="ai-settings-checkbox-row">
            <input
              type="checkbox"
              class="ai-settings-checkbox"
              id="aiSettingsDetectStaleCheckbox"
            />
            <span>Detect stale cells</span>
          </label>
          <label class="ai-settings-checkbox-row">
            <input
              type="checkbox"
              class="ai-settings-checkbox"
              id="aiSettingsDetectDuplicateCheckbox"
            />
            <span>Detect duplicate cells</span>
          </label>
          <label class="ai-settings-checkbox-row">
            <input
              type="checkbox"
              class="ai-settings-checkbox"
              id="aiSettingsDetectDeadCheckbox"
            />
            <span>Detect dead code cells</span>
          </label>
        </div>

        <p
          class="ai-settings-status summary-status"
          id="aiSettingsStatus"
        ></p>

        <div class="ai-settings-actions">
          <button
            class="dialog-btn dialog-btn-primary"
            id="aiSettingsSaveButton"
            type="button"
          >
            Save
          </button>
          <button
            class="dialog-btn"
            id="aiSettingsResetButton"
            type="button"
          >
            Reset
          </button>
        </div>
      </div>
    </details>
    </div>

    <div class="canvas-scroll-area" id="canvasScrollArea">
    <div class="loading-container" id="loadingState" style="display: none">
      <div class="loading-spinner"></div>
      <p>Searching through your notebook...</p>
    </div>

    <div class="default-section" id="defaultSection">
      <h3 class="section-title">All Cells</h3>
      <p
        class="inline-summary-note"
        id="inlineSummaryNote"
        style="display: none"
      >
        Inline preview uses temporary cells. Switch to Sidebar before saving.
      </p>
      <div class="results-container" id="allCellsContainer">
        <p class="section-title">Index your notebook to see cells here.</p>
      </div>
    </div>

    <div
      class="searching-indicator"
      id="searchingIndicator"
      style="display: none"
    >
      <div class="searching-spinner"></div>
      <span>Searching AI…</span>
    </div>

    <div class="results-section" id="resultsSection" style="display: none">
      <div class="top-results">
        <h3 class="section-title" id="topResultsSectionTitle">Top Matches</h3>

        <div class="replace-row" id="replaceRow" style="display: none">
          <div class="replace-wrapper input-wrapper">
            <textarea
              class="replace-input auto-grow-input"
              id="replaceInput"
              rows="1"
              placeholder="Replace"
            ></textarea>
            <div class="search-opts">
              <button
                class="search-opt-btn"
                id="preserveCaseButton"
                title="Preserve Case"
                aria-pressed="false"
              >
                <span class="search-opt-icon preserve-case-icon"></span>
              </button>
            </div>
          </div>
          <button
            class="search-opt-btn replace-btn"
            id="replaceOneButton"
            title="Replace (Enter)"
            aria-label="Replace (Enter)"
          >
            <span class="search-opt-icon replace-icon"></span>
          </button>
          <button
            class="search-opt-btn replace-all-btn"
            id="replaceAllButton"
            title="Replace All"
            aria-label="Replace All"
          >
            <span class="search-opt-icon replace-all-icon"></span>
          </button>
        </div>

        <div class="results-container" id="topResultsContainer"></div>
      </div>
      <details class="other-results" id="otherResults" style="display: none">
        <summary class="other-results-summary">
          <img
            src="icons/dropdown_icon.svg"
            alt="Expand"
            class="chevron-icon icon-16"
          />
          <span>Others...</span>
          <span class="cell-count" id="otherCellCount">(0)</span>
        </summary>
        <div class="results-container" id="otherResultsContainer"></div>
      </details>
    </div>
    </div>

    <div class="dialog-overlay" id="replaceAllOverlay" style="display: none">
      <div class="dialog-box">
        <p class="dialog-message" id="replaceAllMessage"></p>
        <div class="dialog-actions">
          <button
            class="dialog-btn dialog-btn-primary"
            id="replaceAllConfirmButton"
          >
            Replace
          </button>
          <button class="dialog-btn" id="replaceAllCancelButton">Cancel</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
